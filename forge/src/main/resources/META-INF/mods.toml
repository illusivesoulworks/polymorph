modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL= "${issues_url}"
[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${sources_url}"
    logoFile="${mod_id}_icon.png"
    logoBlur = false
    authors = "${mod_author}"
    description = '''${description}'''
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "jei"
    mandatory = false
    versionRange = "[${jei_version},)"
    ordering = "NONE"
    side = "BOTH"
